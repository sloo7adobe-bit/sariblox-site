<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイマー操作 | サリーぶろっくす</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#17191f" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@900&family=Mochiy+Pop+One&family=DotGothic16&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="timer-hw.css?v=4" />
  <script src="timer-hw.js?v=4"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Zen Maru Gothic", sans-serif;
      background: #17191f;
      color: #fff;
      min-height: 100vh;
      padding: 18px 14px 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .box { max-width: 460px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
    h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
    h1 .dot.on { background: #4ade66; box-shadow: 0 0 10px #4ade66; }

    /* プレビュー */
    .preview {
      background: #000;
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      border: 2px solid #3a3f4a;
      border-radius: 14px;
      padding: 16px 10px 18px;
      text-align: center;
      margin-bottom: 16px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
    }
    .pv-label { color: #ffd60a; font-size: 22px; min-height: 26px;
      text-shadow: 1.5px 0 #000, -1.5px 0 #000, 0 1.5px #000, 0 -1.5px #000, 2px 2.5px #000; }
    .pv-time { color: #fff; font-size: 54px; line-height: 1.1; font-variant-numeric: tabular-nums;
      text-shadow: 2.5px 0 #000, -2.5px 0 #000, 0 2.5px #000, 0 -2.5px #000, 4px 4.5px #000; }
    .preview.sh .pv-label, .preview.sh .pv-time { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.9)); }

    .card { background: #22252d; border: 1px solid #3a3f4a; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 13px; color: #9aa3b2; margin: 0 0 10px; font-weight: 700; letter-spacing: 0.08em; }

    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%; font: inherit; font-size: 16px; color: #fff;
      background: #17191f; border: 2px solid #3a3f4a; border-radius: 10px;
      padding: 12px; outline: none;
    }
    input:focus { border-color: #ffd60a; }
    input[type="number"] { text-align: center; -moz-appearance: textfield; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .btn {
      font: inherit; font-weight: 700; font-size: 16px; color: #fff;
      background: #2e3340; border: 2px solid #474e5e; border-radius: 12px;
      padding: 13px 10px; cursor: pointer; width: 100%;
      touch-action: manipulation; transition: transform 80ms, background 120ms;
    }
    .btn:active { transform: scale(0.97); }
    .btn-main { background: #ffd60a; border-color: #ffd60a; color: #15161a; }
    .btn-stop { background: #ff5c6c; border-color: #ff5c6c; color: #15161a; }
    .btn-ghost { background: transparent; }
    .btn:disabled { opacity: 0.4; }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mt { margin-top: 10px; }

    .hms { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto; gap: 6px; align-items: center; }
    .hms span { color: #9aa3b2; font-size: 14px; }

    /* スイッチ */
    .switch { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .switch b { font-size: 15px; }
    .switch input { position: absolute; opacity: 0; }
    .sw-track { width: 56px; height: 32px; border-radius: 999px; background: #474e5e; position: relative; transition: background 150ms; flex-shrink: 0; }
    .sw-thumb { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 150ms; }
    .switch input:checked + .sw-track { background: #ffd60a; }
    .switch input:checked + .sw-track .sw-thumb { transform: translateX(24px); }

    /* 見た目の設定 */
    .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .seg .btn { padding: 11px 2px; font-size: 13px; border-radius: 10px; }
    .seg .btn.on { background: #ffd60a; border-color: #ffd60a; color: #15161a; }
    .seg2 { grid-template-columns: 1fr 1fr; }
    .seg2 .btn { font-size: 15px; padding: 13px 4px; }
    #theme-seg .btn[data-theme="halloween"].on { background: #ff9f1c; border-color: #ff9f1c; }
    .theme-note { font-size: 12px; color: #9aa3b2; margin: 10px 2px 0; line-height: 1.6; }
    .color-row.locked,
    .seg.locked { opacity: 0.35; pointer-events: none; }
    .f-maru { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 800; }
    .f-gothic { font-family: "Noto Sans JP", sans-serif; font-weight: 900; }
    .f-pop { font-family: "Mochiy Pop One", sans-serif; }
    .f-dot { font-family: "DotGothic16", monospace; }
    .f-mincho { font-family: "Shippori Mincho B1", serif; font-weight: 800; }

    .slider-row { display: grid; grid-template-columns: 86px 1fr 52px; gap: 10px; align-items: center; margin-top: 10px; }
    .slider-row:first-of-type { margin-top: 0; }
    .slider-row label { font-size: 13px; color: #cdd3de; }
    .slider-row output { font-size: 13px; color: #9aa3b2; text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #474e5e; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #ffd60a; margin-top: -10px; border: none; }
    input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: #474e5e; }
    input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #ffd60a; border: none; }

    .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .color-item { display: flex; align-items: center; gap: 10px; background: #17191f; border: 2px solid #3a3f4a; border-radius: 10px; padding: 8px 10px; }
    .color-item span { font-size: 13px; color: #cdd3de; }
    input[type="color"] { width: 40px; height: 32px; padding: 0; border: none; background: none; border-radius: 8px; cursor: pointer; }

    .toggles { display: grid; gap: 12px; margin-top: 14px; }

    .msg { font-size: 13px; color: #ff8c98; min-height: 18px; margin: 6px 2px 0; }
    .hint { font-size: 12px; color: #9aa3b2; margin-top: 10px; line-height: 1.7; }
    .hint code { background: #17191f; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="box">
    <h1><span class="dot" id="dot"></span>タイマー操作</h1>

    <!-- パスワード -->
    <div class="card" id="gate">
      <h2>パスワード</h2>
      <div class="row">
        <input type="password" id="pass" inputmode="numeric" placeholder="パスワード" autocomplete="off" />
        <button type="button" class="btn btn-main" id="login" style="flex:0 0 96px">開く</button>
      </div>
      <p class="msg" id="gate-msg"></p>
    </div>

    <!-- 本体 -->
    <div id="panel" hidden>
      <div class="preview" id="preview">
        <div class="pv-label" id="pv-label"></div>
        <div class="pv-time" id="pv-time">0:00</div>
      </div>

      <div class="card">
        <h2>上のテキスト</h2>
        <div class="row">
          <input type="text" id="label" maxlength="40" placeholder="例: イベントまで:" />
          <button type="button" class="btn" id="label-set" style="flex:0 0 96px">反映</button>
        </div>
      </div>

      <div class="card">
        <h2>時間をセット</h2>
        <div class="hms">
          <input type="number" id="h" min="0" max="99" value="0" /><span>時間</span>
          <input type="number" id="m" min="0" max="59" value="10" /><span>分</span>
          <input type="number" id="s" min="0" max="59" value="0" /><span>秒</span>
        </div>
        <button type="button" class="btn mt" id="set-time">この時間にセット</button>
        <div class="grid4 mt">
          <button type="button" class="btn btn-ghost" data-preset="300">5分</button>
          <button type="button" class="btn btn-ghost" data-preset="600">10分</button>
          <button type="button" class="btn btn-ghost" data-preset="1800">30分</button>
          <button type="button" class="btn btn-ghost" data-preset="3600">1時間</button>
        </div>
      </div>

      <div class="card">
        <h2>操作</h2>
        <div class="grid2">
          <button type="button" class="btn btn-main" id="start">▶ スタート</button>
          <button type="button" class="btn" id="pause">⏸ 一時停止</button>
        </div>
        <div class="grid4 mt">
          <button type="button" class="btn btn-ghost" data-adj="60000">+1分</button>
          <button type="button" class="btn btn-ghost" data-adj="-60000">−1分</button>
          <button type="button" class="btn btn-ghost" data-adj="10000">+10秒</button>
          <button type="button" class="btn btn-ghost" data-adj="-10000">−10秒</button>
        </div>
        <button type="button" class="btn btn-stop mt" id="reset">リセット(表示を消す)</button>
      </div>

      <div class="card">
        <h2>テーマ</h2>
        <div class="seg seg2" id="theme-seg">
          <button type="button" class="btn" data-theme="normal">ノーマル</button>
          <button type="button" class="btn" data-theme="halloween">🎃 ハロウィン</button>
        </div>
        <p class="theme-note" id="theme-note" hidden>ハロウィン中は色だけ専用(オレンジ×紫)になります。フォント・サイズ・フチの太さはそのまま効き、「斜め影のずれ」は立体の深さになります。</p>
      </div>

      <div class="card">
        <h2>見た目</h2>
        <div class="seg" id="font-seg">
          <button type="button" class="btn f-maru" data-font="maru">まる</button>
          <button type="button" class="btn f-gothic" data-font="gothic">ゴシック</button>
          <button type="button" class="btn f-pop" data-font="pop">ポップ</button>
          <button type="button" class="btn f-dot" data-font="dot">ドット</button>
          <button type="button" class="btn f-mincho" data-font="mincho">明朝</button>
        </div>
        <div class="mt">
          <div class="slider-row">
            <label>上のテキスト</label>
            <input type="range" id="label-size" min="50" max="250" step="5" value="100" />
            <output id="label-size-out">100%</output>
          </div>
          <div class="slider-row">
            <label>数字</label>
            <input type="range" id="time-size" min="50" max="250" step="5" value="100" />
            <output id="time-size-out">100%</output>
          </div>
          <div class="slider-row">
            <label>フチの太さ</label>
            <input type="range" id="outline-w" min="10" max="300" step="5" value="100" />
            <output id="outline-w-out">100%</output>
          </div>
          <div class="slider-row">
            <label>斜め影のずれ</label>
            <input type="range" id="drop-w" min="10" max="300" step="5" value="100" />
            <output id="drop-w-out">100%</output>
          </div>
          <div class="slider-row">
            <label>グロー(光)</label>
            <input type="range" id="glow" min="0" max="100" step="5" value="0" />
            <output id="glow-out">0%</output>
          </div>
        </div>
        <div class="color-row">
          <label class="color-item"><input type="color" id="label-color" value="#ffd60a" /><span>上のテキストの色</span></label>
          <label class="color-item"><input type="color" id="time-color" value="#ffffff" /><span>数字の色</span></label>
        </div>
        <div class="toggles">
          <label class="switch">
            <b>フチ(まわりの縁取り)</b>
            <input type="checkbox" id="outline" checked />
            <span class="sw-track"><span class="sw-thumb"></span></span>
          </label>
          <label class="switch">
            <b>斜めの影(うしろのくっきり影)</b>
            <input type="checkbox" id="drop" checked />
            <span class="sw-track"><span class="sw-thumb"></span></span>
          </label>
          <label class="switch">
            <b>ふんわりシャドウ(ぼかし)</b>
            <input type="checkbox" id="shadow" checked />
            <span class="sw-track"><span class="sw-thumb"></span></span>
          </label>
        </div>
        <button type="button" class="btn btn-ghost mt" id="look-reset">見た目を最初に戻す</button>
      </div>

      <p class="msg" id="msg"></p>
      <p class="hint">
        OBS には「ブラウザ」ソースで <code>https://sariblox.com/timer</code> を追加(幅 800 × 高さ 300 がおすすめ)。背景は自動で透明になります。
      </p>
    </div>
  </div>

  <script>
    (function () {
      var LS = "sb_timer_pass";
      var $ = function (id) { return document.getElementById(id); };
      var pass = "";
      var state = null;
      var offset = 0;
      var synced = false;

      function api(body) {
        body.pass = pass;
        return fetch("/api/timer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
      }

      function showMsg(t) {
        $("msg").textContent = t || "";
        if (t) setTimeout(function () { $("msg").textContent = ""; }, 2500);
      }

      function apply(res) {
        if (res.status === 401) { logout(); return; }
        if (res.body && res.body.ok) {
          state = res.body.state;
          if (res.body.now) offset = res.body.now - Date.now();
          syncInputs();
        } else {
          showMsg((res.body && res.body.error) || "失敗しました。");
        }
      }

      function act(body) { api(body).then(apply).catch(function () { showMsg("通信に失敗しました。"); }); }

      function logout() {
        try { localStorage.removeItem(LS); } catch (e) {}
        pass = "";
        $("panel").hidden = true;
        $("gate").hidden = false;
        $("gate-msg").textContent = "パスワードが違います。";
      }

      function login(p) {
        pass = p;
        api({ action: "auth" }).then(function (res) {
          if (res.body && res.body.ok) {
            try { localStorage.setItem(LS, p); } catch (e) {}
            $("gate").hidden = true;
            $("panel").hidden = false;
            state = res.body.state;
            if (res.body.now) offset = res.body.now - Date.now();
            synced = false;
            syncInputs();
          } else {
            pass = "";
            $("gate-msg").textContent = (res.body && res.body.error) || "パスワードが違います。";
          }
        }).catch(function () { $("gate-msg").textContent = "通信に失敗しました。"; });
      }

      var FONT_MAP = {
        maru: "'M PLUS Rounded 1c', sans-serif",
        gothic: "'Noto Sans JP', sans-serif",
        pop: "'Mochiy Pop One', sans-serif",
        dot: "'DotGothic16', monospace",
        mincho: "'Shippori Mincho B1', serif",
      };

      function syncInputs() {
        if (!state || synced) return;
        synced = true;
        $("label").value = state.label || "";
        $("shadow").checked = state.shadow !== false;
        $("outline").checked = state.outline !== false;
        $("label-size").value = state.labelSize || 100;
        $("time-size").value = state.timeSize || 100;
        $("label-size-out").textContent = (state.labelSize || 100) + "%";
        $("time-size-out").textContent = (state.timeSize || 100) + "%";
        $("outline-w").value = state.outlineW || 100;
        $("outline-w-out").textContent = (state.outlineW || 100) + "%";
        $("drop").checked = state.drop !== false;
        $("drop-w").value = state.dropW || 100;
        $("drop-w-out").textContent = (state.dropW || 100) + "%";
        $("glow").value = state.glow || 0;
        $("glow-out").textContent = (state.glow || 0) + "%";
        $("label-color").value = state.labelColor || "#ffd60a";
        $("time-color").value = state.timeColor || "#ffffff";
      }

      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function format(ms) {
        var t = Math.max(0, Math.ceil(ms / 1000));
        var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
        return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
      }

      function tick() {
        if (!state) return;
        var remain = state.running ? state.endAt - (Date.now() + offset) : state.remainMs;
        var pl = $("pv-label"), pt = $("pv-time");
        var hw = state.theme === "halloween" && !!window.TimerHW;
        var lt = state.label || "", tt = format(remain);
        if (pl.textContent !== lt) { pl.textContent = lt; pl.setAttribute("data-text", lt); }
        if (pt.textContent !== tt) { pt.textContent = tt; pt.setAttribute("data-text", tt); }
        $("preview").classList.toggle("sh", state.shadow !== false);
        $("preview").classList.toggle("hw", hw);
        $("preview").style.fontFamily = FONT_MAP[state.font] || FONT_MAP.maru;
        pl.style.fontSize = Math.round(22 * (state.labelSize || 100) / 100) + "px";
        pt.style.fontSize = Math.round(54 * (state.timeSize || 100) / 100) + "px";
        pl.classList.toggle("hw", hw);
        pt.classList.toggle("hw", hw);
        if (window.TimerHW) { // グロー + ふんわりシャドウ(プレビューの大きさに合わせて vw を px に換算)
          var f = TimerHW.filter(state, function (n) { return (n * 2.8).toFixed(1) + "px"; });
          if (f !== tick.lastF) { tick.lastF = f; pl.style.filter = f; pt.style.filter = f; }
        }
        pl.style.color = hw ? "#2b0d40" : (state.labelColor || "#ffd60a");
        pt.style.color = hw ? "#2b0d40" : (state.timeColor || "#ffffff");
        document.querySelectorAll("#font-seg .btn").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-font") === (state.font || "maru"));
        });
        if (hw) {
          var hs = TimerHW.shadow({ k: (state.outlineW || 100) / 100, kd: (state.dropW || 100) / 100, outline: state.outline !== false, drop: state.drop !== false });
          if (hs !== tick.lastHs) { // ブラウザは読み返すと書き方を変えるので、自分で前回の値を覚えておく
            tick.lastHs = hs;
            pl.style.textShadow = hs;
            pt.style.textShadow = hs;
          }
          $("dot").classList.toggle("on", !!state.running);
          document.querySelectorAll("#theme-seg .btn").forEach(function (b) {
            b.classList.toggle("on", b.getAttribute("data-theme") === "halloween");
          });
          $("theme-note").hidden = false;
          document.querySelector(".color-row").classList.add("locked");
          return;
        }
        var k = (state.outlineW || 100) / 100;
        var kd = (state.dropW || 100) / 100;
        var oc = hw ? "#2e0f54" : "#000";
        function shadows(o) {
          var parts = [];
          if (state.outline !== false) {
            var r = o * k, d7 = r * 0.707;
            parts.push(r + "px 0 " + oc, -r + "px 0 " + oc, "0 " + r + "px " + oc, "0 " + -r + "px " + oc,
              d7 + "px " + d7 + "px " + oc, -d7 + "px " + d7 + "px " + oc, d7 + "px " + -d7 + "px " + oc, -d7 + "px " + -d7 + "px " + oc);
          }
          if (state.drop !== false) {
            parts.push(1.6 * o * kd + "px " + 1.8 * o * kd + "px " + oc);
          }
          return parts.length ? parts.join(", ") : "none";
        }
        tick.lastHs = null;
        pl.style.textShadow = shadows(1.5);
        pt.style.textShadow = shadows(2.5);
        $("dot").classList.toggle("on", !!state.running);
        document.querySelectorAll("#font-seg .btn").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-font") === (state.font || "maru"));
        });
        document.querySelectorAll("#theme-seg .btn").forEach(function (b) {
          b.classList.toggle("on", b.getAttribute("data-theme") === (state.theme || "normal"));
        });
        $("theme-note").hidden = !hw;
        document.querySelector(".color-row").classList.toggle("locked", hw);
      }

      // ---- 操作 ----
      $("login").addEventListener("click", function () { login($("pass").value.trim()); });
      $("pass").addEventListener("keydown", function (e) { if (e.key === "Enter") login($("pass").value.trim()); });

      $("label-set").addEventListener("click", function () { act({ action: "set", label: $("label").value }); });
      $("set-time").addEventListener("click", function () {
        var ms = ((+$("h").value || 0) * 3600 + (+$("m").value || 0) * 60 + (+$("s").value || 0)) * 1000;
        act({ action: "set", remainMs: ms });
      });
      document.querySelectorAll("[data-preset]").forEach(function (b) {
        b.addEventListener("click", function () {
          var sec = +b.getAttribute("data-preset");
          $("h").value = Math.floor(sec / 3600); $("m").value = Math.floor((sec % 3600) / 60); $("s").value = 0;
          act({ action: "set", remainMs: sec * 1000 });
        });
      });
      $("start").addEventListener("click", function () { act({ action: "start" }); });
      $("pause").addEventListener("click", function () { act({ action: "pause" }); });
      $("reset").addEventListener("click", function () { act({ action: "reset" }); });
      document.querySelectorAll("[data-adj]").forEach(function (b) {
        b.addEventListener("click", function () { act({ action: "adjust", deltaMs: +b.getAttribute("data-adj") }); });
      });
      $("shadow").addEventListener("change", function () { act({ action: "set", shadow: $("shadow").checked }); });
      $("outline").addEventListener("change", function () { act({ action: "set", outline: $("outline").checked }); });
      document.querySelectorAll("#font-seg .btn").forEach(function (b) {
        b.addEventListener("click", function () {
          if (state) state.font = b.getAttribute("data-font"); // 先に見た目へ反映
          act({ action: "set", font: b.getAttribute("data-font") });
        });
      });
      document.querySelectorAll("#theme-seg .btn").forEach(function (b) {
        b.addEventListener("click", function () {
          if (state) state.theme = b.getAttribute("data-theme");
          act({ action: "set", theme: b.getAttribute("data-theme") });
        });
      });
      function bindSlider(id, outId, key) {
        var el = $(id), out = $(outId);
        el.addEventListener("input", function () { // 動かしている間はプレビューだけ更新
          out.textContent = el.value + "%";
          if (state) state[key] = +el.value;
        });
        el.addEventListener("change", function () { // 指を離したら送信
          var body = { action: "set" };
          body[key] = +el.value;
          act(body);
        });
        out.textContent = el.value + "%";
      }
      bindSlider("label-size", "label-size-out", "labelSize");
      bindSlider("time-size", "time-size-out", "timeSize");
      bindSlider("outline-w", "outline-w-out", "outlineW");
      bindSlider("drop-w", "drop-w-out", "dropW");
      bindSlider("glow", "glow-out", "glow");
      $("drop").addEventListener("change", function () { act({ action: "set", drop: $("drop").checked }); });
      $("label-color").addEventListener("change", function () { act({ action: "set", labelColor: $("label-color").value }); });
      $("time-color").addEventListener("change", function () { act({ action: "set", timeColor: $("time-color").value }); });
      $("look-reset").addEventListener("click", function () {
        synced = false; // 返ってきた値でスライダーなども戻す
        act({ action: "set", theme: "normal", font: "maru", labelSize: 100, timeSize: 100, labelColor: "#ffd60a", timeColor: "#ffffff", outline: true, outlineW: 100, drop: true, dropW: 100, glow: 0, shadow: true });
      });

      // ---- 定期更新 ----
      setInterval(function () {
        if (!pass || $("panel").hidden) return;
        fetch("/api/timer", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.ok) { state = j.state; if (j.now) offset = j.now - Date.now(); }
        }).catch(function () {});
      }, 2500);
      setInterval(tick, 200);

      // 保存済みパスワードで自動ログイン
      var saved = "";
      try { saved = localStorage.getItem(LS) || ""; } catch (e) {}
      if (saved) login(saved);
    })();
  </script>
</body>
</html>
