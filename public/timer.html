<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイマー</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@900&family=Mochiy+Pop+One&family=DotGothic16&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="timer-hw.css?v=4" />
  <script src="timer-hw.js?v=4"></script>
  <style>
    /* OBS のブラウザソースにそのまま入れる前提: 背景は完全に透明 */
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap);
      /* 大きさのものさし(箱モード: 800×300 など横長の小さいソース。ステージモードは下の @media で上書き) */
      --lf: 7.5vw;  /* 上の文字の大きさ */
      --lo: 0.5vw;  /* 上の文字のフチ */
      --tf: 19vw;   /* 数字の大きさ */
      --to: 0.9vw;  /* 数字のフチ */
      --gap: 0.5vw;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transition: opacity 250ms linear;
      user-select: none;
    }

    .wrap.is-on {
      opacity: 1;
    }

    /* フチ(8 方向の縁取り)と、右下へずれた斜めの影は別もの。それぞれ ON/OFF と太さを変えられる
       OBS の古いブラウザでも確実に出るよう、どちらも文字影で作る。色はテーマで変わる */
    .label,
    .time {
      --oc: #000;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        calc(var(--o) * 1) 0 0 var(--oc), calc(var(--o) * -1) 0 0 var(--oc),
        0 calc(var(--o) * 1) 0 var(--oc), 0 calc(var(--o) * -1) 0 var(--oc),
        calc(var(--o) * 0.707) calc(var(--o) * 0.707) 0 var(--oc), calc(var(--o) * -0.707) calc(var(--o) * 0.707) 0 var(--oc),
        calc(var(--o) * 0.707) calc(var(--o) * -0.707) 0 var(--oc), calc(var(--o) * -0.707) calc(var(--o) * -0.707) 0 var(--oc),
        calc(var(--o) * 0.924) calc(var(--o) * 0.383) 0 var(--oc), calc(var(--o) * -0.924) calc(var(--o) * 0.383) 0 var(--oc),
        calc(var(--o) * 0.924) calc(var(--o) * -0.383) 0 var(--oc), calc(var(--o) * -0.924) calc(var(--o) * -0.383) 0 var(--oc),
        calc(var(--o) * 0.383) calc(var(--o) * 0.924) 0 var(--oc), calc(var(--o) * -0.383) calc(var(--o) * 0.924) 0 var(--oc),
        calc(var(--o) * 0.383) calc(var(--o) * -0.924) 0 var(--oc), calc(var(--o) * -0.383) calc(var(--o) * -0.924) 0 var(--oc),
        calc(var(--d) * 1.6) calc(var(--d) * 1.8) 0 var(--oc);
    }

    /* フチだけ消す(斜めの影は残る) */
    .wrap.no-outline .label,
    .wrap.no-outline .time {
      text-shadow: calc(var(--d) * 1.6) calc(var(--d) * 1.8) 0 var(--oc);
    }

    /* 斜めの影だけ消す(フチは残る) */
    .wrap.no-drop .label,
    .wrap.no-drop .time {
      text-shadow:
        calc(var(--o) * 1) 0 0 var(--oc), calc(var(--o) * -1) 0 0 var(--oc),
        0 calc(var(--o) * 1) 0 var(--oc), 0 calc(var(--o) * -1) 0 var(--oc),
        calc(var(--o) * 0.707) calc(var(--o) * 0.707) 0 var(--oc), calc(var(--o) * -0.707) calc(var(--o) * 0.707) 0 var(--oc),
        calc(var(--o) * 0.707) calc(var(--o) * -0.707) 0 var(--oc), calc(var(--o) * -0.707) calc(var(--o) * -0.707) 0 var(--oc),
        calc(var(--o) * 0.924) calc(var(--o) * 0.383) 0 var(--oc), calc(var(--o) * -0.924) calc(var(--o) * 0.383) 0 var(--oc),
        calc(var(--o) * 0.924) calc(var(--o) * -0.383) 0 var(--oc), calc(var(--o) * -0.924) calc(var(--o) * -0.383) 0 var(--oc),
        calc(var(--o) * 0.383) calc(var(--o) * 0.924) 0 var(--oc), calc(var(--o) * -0.383) calc(var(--o) * 0.924) 0 var(--oc),
        calc(var(--o) * 0.383) calc(var(--o) * -0.924) 0 var(--oc), calc(var(--o) * -0.383) calc(var(--o) * -0.924) 0 var(--oc);
    }

    .wrap.no-outline.no-drop .label,
    .wrap.no-outline.no-drop .time {
      text-shadow: none;
    }

    .label {
      --o: calc(var(--lo) * var(--ls, 1) * var(--ow, 1));
      --d: calc(var(--lo) * var(--ls, 1) * var(--dw, 1));
      font-size: calc(var(--lf) * var(--ls, 1));
      color: var(--lc, #fce80c);
    }

    .label:empty {
      display: none;
    }

    .time {
      --o: calc(var(--to) * var(--ts, 1) * var(--ow, 1));
      --d: calc(var(--to) * var(--ts, 1) * var(--dw, 1));
      font-size: calc(var(--tf) * var(--ts, 1));
      color: var(--tc, #fff);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* ステージモード: OBS に画面いっぱい(1920×1080 など 16:9)で入れたとき、上のまん中に置く
       位置と大きさは配信画面の見本(上の文字 34px・数字 28px の高さ、x=960 中心)に合わせた。単位は vw なので 1280×720 でも同じ見え方 */
    @media (min-aspect-ratio: 3/2) and (max-aspect-ratio: 2/1) {
      .wrap {
        justify-content: flex-start;
        --lf: 2.42vw;
        --lo: 0.19vw;
        --tf: 2.05vw;
        --to: 0.17vw;
        --gap: 0.86vw;
        padding-top: 4.26vw;
      }
      .label, .time { line-height: 1; }
    }

    /* ふんわりシャドウとグローは JS(timer-hw.js の filter)が wrap.style.filter に入れる */

    /* ==========================================================
       ハロウィンテーマ: 炎のグラデーション文字 + 立体の厚み + こげ茶のフチ(timer-hw.css / timer-hw.js)
       ふんわりシャドウは、紫がかった落ち影だけ
       ========================================================== */

  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="label" id="label"></div>
    <div class="time" id="time"></div>
  </div>

  <script>
    (function () {
      var wrap = document.getElementById("wrap");
      var labelEl = document.getElementById("label");
      var timeEl = document.getElementById("time");
      var state = null;
      var offset = 0; // サーバー時計とのずれ
      var lastHwShadow = null;
      var lastFilter = null;

      function fetchState() {
        fetch("/api/timer", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j || !j.ok) return;
            state = j.state || null;
            if (j.now) offset = j.now - Date.now();
          })
          .catch(function () {});
      }

      function pad(n) { return (n < 10 ? "0" : "") + n; }

      function format(ms, style) {
        var t = Math.max(0, Math.ceil(ms / 1000));
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        if (style === "ms") return h > 0 ? h + "h " + m + "m " + pad(s) + "s" : m > 0 ? m + "m " + pad(s) + "s" : s + "s";
        return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
      }

      var FONT_MAP = {
        maru: "'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif",
        gothic: "'Noto Sans JP', sans-serif",
        pop: "'Mochiy Pop One', sans-serif",
        dot: "'DotGothic16', monospace",
        mincho: "'Shippori Mincho B1', serif",
      };

      function tick() {
        if (!state) {
          wrap.classList.remove("is-on");
          return;
        }
        var remain = state.running ? state.endAt - (Date.now() + offset) : state.remainMs;
        var show = state.running || state.remainMs > 0;
        wrap.classList.toggle("is-on", !!show);
        wrap.classList.toggle("has-shadow", state.shadow !== false);
        wrap.classList.toggle("no-outline", state.outline === false);
        wrap.classList.toggle("no-drop", state.drop === false);
        var hw = state.theme === "halloween" && !!window.TimerHW;
        wrap.classList.toggle("theme-halloween", hw);
        wrap.style.fontFamily = FONT_MAP[state.font] || FONT_MAP.maru;
        var hwShadow = hw
          ? TimerHW.shadow({ k: (state.outlineW || 100) / 100, kd: (state.dropW || 100) / 100, outline: state.outline !== false, drop: state.drop !== false })
          : "";
        var flt = window.TimerHW ? TimerHW.filter(state, function (n) { return n + "vw"; }) : "none";
        if (flt !== lastFilter) { lastFilter = flt; wrap.style.filter = flt; }
        if (hwShadow !== lastHwShadow) { // 変わったときだけ書き換える(毎回だと OBS で無駄に再描画される)
          lastHwShadow = hwShadow;
          [labelEl, timeEl].forEach(function (el) {
            el.classList.toggle("hw", hw);
            el.style.textShadow = hwShadow;
          });
        }
        wrap.style.setProperty("--ow", (state.outlineW || 100) / 100);
        wrap.style.setProperty("--dw", (state.dropW || 100) / 100);
        wrap.style.setProperty("--ls", (state.labelSize || 100) / 100);
        wrap.style.setProperty("--ts", (state.timeSize || 100) / 100);
        wrap.style.setProperty("--lc", state.labelColor || "#fce80c");
        wrap.style.setProperty("--tc", state.timeColor || "#ffffff");
        if (!show) return;
        var lt = state.label || "";
        var tt = format(remain, state.format);
        if (labelEl.textContent !== lt) { labelEl.textContent = lt; labelEl.setAttribute("data-text", lt); }
        if (timeEl.textContent !== tt) { timeEl.textContent = tt; timeEl.setAttribute("data-text", tt); }
      }

      // PC が設定を受け取った瞬間に押し出してもらう(待ち時間ゼロ)。つながらないときのために、たまに自分でも確認する
      if (window.EventSource) {
        var es = new EventSource("/api/timer/stream");
        es.onmessage = function (e) {
          try {
            var j = JSON.parse(e.data);
            if (!j || !j.ok) return;
            state = j.state || null;
            if (j.now) offset = j.now - Date.now();
            tick();
          } catch (err) {}
        };
      }
      fetchState();
      setInterval(fetchState, 3000);
      setInterval(tick, 200);
    })();
  </script>
</body>
</html>
