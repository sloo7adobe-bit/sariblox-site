<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイマー</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@900&family=Mochiy+Pop+One&family=DotGothic16&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet" />
  <style>
    /* OBS のブラウザソースにそのまま入れる前提: 背景は完全に透明 */
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5vw;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transition: opacity 250ms linear;
      user-select: none;
    }

    .wrap.is-on {
      opacity: 1;
    }

    /* フチは 8 方向の文字影で作る(OBS の古いブラウザでも確実に出る)。色はテーマで変わる */
    .label,
    .time {
      --oc: #000;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        calc(var(--o) * 1) 0 0 var(--oc), calc(var(--o) * -1) 0 0 var(--oc),
        0 calc(var(--o) * 1) 0 var(--oc), 0 calc(var(--o) * -1) 0 var(--oc),
        calc(var(--o) * 0.8) calc(var(--o) * 0.8) 0 var(--oc), calc(var(--o) * -0.8) calc(var(--o) * 0.8) 0 var(--oc),
        calc(var(--o) * 0.8) calc(var(--o) * -0.8) 0 var(--oc), calc(var(--o) * -0.8) calc(var(--o) * -0.8) 0 var(--oc),
        calc(var(--o) * 1.6) calc(var(--o) * 1.8) 0 var(--oc);
    }

    .label {
      --o: calc(0.5vw * var(--ls, 1) * var(--ow, 1));
      font-size: calc(7.5vw * var(--ls, 1));
      color: var(--lc, #ffd60a);
    }

    .label:empty {
      display: none;
    }

    .time {
      --o: calc(0.9vw * var(--ts, 1) * var(--ow, 1));
      font-size: calc(19vw * var(--ts, 1));
      color: var(--tc, #fff);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* フチなし */
    .wrap.no-outline .label,
    .wrap.no-outline .time {
      text-shadow: none;
    }

    /* シャドウ(コントローラーから ON / OFF できる) */
    .wrap.has-shadow {
      filter: drop-shadow(0 1vw 2.2vw rgba(0, 0, 0, 0.65));
    }

    /* ==========================================================
       ハロウィンテーマ: かぼちゃオレンジの数字 + 深い紫のフチ + ライムのラベル
       まわりに🎃🦇👻がふわふわ浮かぶ(配信の雰囲気用。読みやすさ優先で動きはゆっくり)
       ========================================================== */
    .wrap.theme-halloween .label {
      color: #aef53c;
      --oc: #2e0f54;
    }

    .wrap.theme-halloween .time {
      color: #ff9f1c;
      --oc: #2e0f54;
    }

    .wrap.theme-halloween.has-shadow {
      filter: drop-shadow(0 0.7vw 1.1vw rgba(26, 6, 46, 0.75)) drop-shadow(0 0 1.1vw rgba(154, 74, 255, 0.3));
    }

    .deco {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    }

    .deco.is-on {
      display: block;
    }

    .deco span {
      position: absolute;
      line-height: 1;
      animation: hw-float 3.4s ease-in-out infinite alternate;
      filter: drop-shadow(0 0.4vw 0.9vw rgba(26, 6, 46, 0.55));
    }

    .deco .d1 { left: 1.5%;  top: 6%;    font-size: 7vw;   animation-delay: -0.4s; }
    .deco .d2 { right: 2%;   top: 3%;    font-size: 4.8vw; animation-delay: -1.5s; animation-duration: 2.8s; }
    .deco .d3 { left: 2.5%;  bottom: 6%; font-size: 4.8vw; animation-delay: -2.2s; animation-duration: 4s; }
    .deco .d4 { right: 1.5%; bottom: 8%; font-size: 6.5vw; animation-delay: -1s; }

    @keyframes hw-float {
      from { transform: translateY(-0.7vw) rotate(-7deg); }
      to   { transform: translateY(0.9vw) rotate(6deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .deco span { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="label" id="label"></div>
    <div class="time" id="time"></div>
  </div>
  <div class="deco" id="deco" aria-hidden="true">
    <span class="d1">🎃</span><span class="d2">🦇</span><span class="d3">👻</span><span class="d4">🎃</span>
  </div>

  <script>
    (function () {
      var wrap = document.getElementById("wrap");
      var labelEl = document.getElementById("label");
      var timeEl = document.getElementById("time");
      var state = null;
      var offset = 0; // サーバー時計とのずれ

      function fetchState() {
        fetch("/api/timer", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j || !j.ok) return;
            state = j.state || null;
            if (j.now) offset = j.now - Date.now();
          })
          .catch(function () {});
      }

      function pad(n) { return (n < 10 ? "0" : "") + n; }

      function format(ms) {
        var t = Math.max(0, Math.ceil(ms / 1000));
        var h = Math.floor(t / 3600);
        var m = Math.floor((t % 3600) / 60);
        var s = t % 60;
        return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
      }

      var FONT_MAP = {
        maru: "'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif",
        gothic: "'Noto Sans JP', sans-serif",
        pop: "'Mochiy Pop One', sans-serif",
        dot: "'DotGothic16', monospace",
        mincho: "'Shippori Mincho B1', serif",
      };

      function tick() {
        if (!state) {
          wrap.classList.remove("is-on");
          return;
        }
        var remain = state.running ? state.endAt - (Date.now() + offset) : state.remainMs;
        var show = state.running || state.remainMs > 0;
        wrap.classList.toggle("is-on", !!show);
        wrap.classList.toggle("has-shadow", state.shadow !== false);
        wrap.classList.toggle("no-outline", state.outline === false);
        wrap.classList.toggle("theme-halloween", state.theme === "halloween");
        document.getElementById("deco").classList.toggle("is-on", state.theme === "halloween" && !!show);
        wrap.style.fontFamily = FONT_MAP[state.font] || FONT_MAP.maru;
        wrap.style.setProperty("--ow", (state.outlineW || 100) / 100);
        wrap.style.setProperty("--ls", (state.labelSize || 100) / 100);
        wrap.style.setProperty("--ts", (state.timeSize || 100) / 100);
        wrap.style.setProperty("--lc", state.labelColor || "#ffd60a");
        wrap.style.setProperty("--tc", state.timeColor || "#ffffff");
        if (!show) return;
        labelEl.textContent = state.label || "";
        timeEl.textContent = format(remain);
      }

      fetchState();
      setInterval(fetchState, 3000);
      setInterval(tick, 200);
    })();
  </script>
</body>
</html>
